<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORMATION SCANNER · live</title>
<style>
  :root{
    --bg:#0c0d0f; --panel:#131418; --card:#181818; --line:#25262c; --line2:#1a1b20;
    --txt:#e2e2e4; --muted:#6b6d75; --dim:#43454c;
    --up:#4E966F; --down:#DD3742; --accent:#56b6c2; --accent-bg:rgba(86,182,194,.12);
    --amber:#c9a23a;
    --mono:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Consolas,'Courier New',monospace;
    --cols:5; --gap:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{background:var(--bg); color:var(--txt); font-family:var(--mono); font-size:13px;
    display:flex; flex-direction:column; overflow:hidden}
  header{flex:0 0 auto; border-bottom:1px solid var(--line)}
  .bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:7px 12px}
  .title{font-size:14px; letter-spacing:1px; color:#fff}
  .lbl{font-size:10px; color:var(--muted); letter-spacing:1px}
  .sep{width:1px; align-self:stretch; background:var(--line)}
  a{color:var(--accent); text-decoration:none; font-size:11px}
  input{background:var(--bg); border:1px solid var(--line); color:var(--txt);
    font-family:var(--mono); font-size:12px; padding:4px 7px; border-radius:3px; width:58px; text-align:right}
  input:focus{outline:none; border-color:var(--accent)}
  button{background:var(--panel); border:1px solid var(--line); color:var(--muted);
    font-family:var(--mono); font-size:11.5px; padding:4px 10px; border-radius:3px; cursor:pointer}
  button:hover{border-color:var(--accent); color:var(--txt)}
  button.on{background:var(--accent-bg); border-color:var(--accent); color:#fff}
  .status{margin-left:auto; display:flex; gap:14px; font-size:10.5px; align-items:center}
  .stat{color:var(--muted)} .stat b{color:var(--txt); font-weight:500}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--dim); margin-right:5px}
  .dot.ok{background:var(--up); box-shadow:0 0 5px var(--up)}
  .dot.err{background:var(--down); box-shadow:0 0 5px var(--down)}

  .grid-wrap{flex:1 1 auto; overflow-y:auto; padding:var(--gap)}
  .grid{display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:var(--gap)}
  .empty{padding:60px; text-align:center; color:var(--muted); grid-column:1/-1}
  .card{width:100%; aspect-ratio:4/3; background:var(--card); border:1px solid #202024;
    border-radius:4px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; position:relative}
  .card:hover{border-color:#34363c}
  .card .chart{flex:0 0 74%; position:relative}
  .card canvas{width:100%; height:100%; display:block}
  .card .meta{flex:1; display:flex; flex-direction:column; justify-content:center; padding:3px 7px;
    border-top:1px solid #202024; min-width:0}
  .meta .r1{display:flex; justify-content:space-between; align-items:baseline; gap:6px}
  .meta .sym{font-size:12px; color:#fff; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .meta .price{font-size:11px}
  .meta .r2{display:flex; justify-content:space-between; gap:6px; margin-top:1px; font-size:10px}
  .badge{position:absolute; top:4px; left:5px; font-size:9px; letter-spacing:1px; padding:1px 5px;
    border-radius:2px; z-index:3; background:rgba(12,13,15,.65); font-weight:700}
  .badge.hot{color:var(--amber)}
  .badge.open{color:var(--accent)}
  .badge.wait{color:var(--muted)}
  .dirb{position:absolute; top:4px; right:5px; font-size:9px; letter-spacing:1px; padding:1px 5px;
    border-radius:2px; z-index:3; background:rgba(12,13,15,.65); font-weight:700}
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
  .grid-wrap::-webkit-scrollbar{width:9px}
  .grid-wrap::-webkit-scrollbar-thumb{background:#26282e; border-radius:5px}

  /* scan profiles panel (moved here from Settings) */
  #profPanel{display:none; border-bottom:1px solid var(--line); background:var(--panel);
    padding:10px 12px; overflow-x:auto}
  #profPanel table{width:100%; border-collapse:collapse; font-size:11.5px}
  #profPanel th{color:var(--muted); font-weight:500; text-align:left; padding:4px 6px; font-size:10px;
    letter-spacing:.5px; border-bottom:1px solid var(--line)}
  #profPanel td{padding:5px 6px; border-bottom:1px solid var(--line2); white-space:nowrap}
  #profPanel input.num{width:52px}
  #profPanel input.pVol{width:88px}
  #profPanel input.name{width:130px; text-align:left}
  #profPanel select{background:var(--bg); border:1px solid var(--line); color:var(--txt);
    font-family:var(--mono); font-size:12px; padding:4px 7px; border-radius:3px}
  #profPanel .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px}
  #profPanel .hint{font-size:10.5px; color:var(--dim); margin-top:8px}
  button.danger:hover{border-color:var(--down); color:var(--down)}
  #toast{position:fixed; bottom:18px; right:18px; background:var(--panel); border:1px solid var(--accent);
    color:var(--txt); padding:9px 14px; border-radius:4px; font-size:12px; display:none; z-index:99}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="title">FORMATION SCANNER</span>
    <span class="lbl">LIVE SCANNER — OBSERVATIONS BEING SCORED</span>
    <div class="sep"></div>
    <span class="lbl">COLUMNS</span><input id="cols" type="number" min="1" max="10" value="5">
    <button id="refresh">REFRESH</button>
    <button id="profToggle">PROFILES</button>
    <div class="status">
      <span class="stat"><span class="dot" id="dot"></span><b id="engTxt">…</b></span>
      <span class="stat">awaiting signal <b id="cWait">—</b></span>
      <span class="stat">open <b id="cOpen">—</b></span>
      <span class="stat">updated <b id="ts">—</b></span>
    </div>
  </div>
</header>
<div id="profPanel">
  <table id="profTable">
    <thead><tr>
      <th>ON</th><th>NAME</th><th>TF</th><th>WINDOW, BARS</th><th>k1</th><th>k2</th><th>k3</th><th>SCORE TTL</th>
      <th>TOP N</th><th>MIN 24H VOL</th><th></th><th></th>
    </tr></thead>
    <tbody></tbody>
  </table>
  <div class="row">
    <input class="name" id="newProfName" placeholder="new profile name">
    <button id="btnAddProf">+ ADD PROFILE</button>
  </div>
  <div class="hint">k1–k3 are the hypothesis level coefficients. TOP N and MIN 24H VOL define the coin universe. Saving restarts the engine.</div>
</div>
<div class="grid-wrap"><div class="grid" id="grid"><div class="empty">loading…</div></div></div>
<div id="toast"></div>
<script src="/chart.js"></script>
<script src="/cards.js"></script>
<script src="/nav.js"></script>
</body>
</html>
